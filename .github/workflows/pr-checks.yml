name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # Skip the build/test jobs when a PR only touches files that can't affect
  # the site: tickets, Markdown docs, and the flag pack (read only by
  # scripts/create-locations.mjs). Saves a build (~400 Contentful calls).
  #
  # This is a job-level `if:` rather than `paths-ignore` on the workflow
  # because "Quality Checks" is a required status check: a workflow that
  # never runs never reports it, blocking the merge, whereas a job skipped
  # by `if:` counts as passing.
  #
  # The list below is an allowlist of *skippable* paths, so anything new
  # runs the full checks by default. Detection fails safe: if the file list
  # can't be fetched, the checks run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "Couldn't list changed files; running full checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            case "$f" in
              tickets/*|assets/flags/*|*.md) ;;
              *) code=true; echo "Code change: $f"; break ;;
            esac
          done <<< "$files"

          [ "$code" = false ] && echo "Docs/tickets/flags only; skipping build and tests."
          echo "code=$code" >> "$GITHUB_OUTPUT"

  quality-checks:
    name: Quality Checks
    needs: changes
    # Skip only on an explicit "false", so a failed `changes` job still runs
    # the checks (a skipped required check would count as passing).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests
        run: npm test
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      # The only build in this workflow (~400 CDA calls): the E2E job tests
      # this exact output rather than building again. Placeholder images and
      # no GA id make the pages hermetic for E2E (no external requests) and
      # keep Contentful asset bandwidth untouched.
      - name: Run build (placeholder images, no analytics)
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_USE_PLACEHOLDER_IMAGES: 'true'

      - name: Upload static export for E2E
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: out/
          retention-days: 1

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  e2e:
    name: E2E Tests
    needs: quality-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # On a cache hit, restore the browser binary and only install the OS
      # libraries (apt — can't be cached, runners are ephemeral). On a miss,
      # do the full download + deps.
      - name: Install Playwright (browser + OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Reuse the Quality Checks build instead of building again, so each
      # PR run hits Contentful once, not twice.
      - name: Download static export
        uses: actions/download-artifact@v8
        with:
          name: static-export
          path: out/

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
